name: DevOps CI Build Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository Code
        uses: actions/checkout@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: npm ci    

      - name: Build Docker Image
        run: docker build -t devops-nodejs-app:${{ github.sha }} .

      - name: Ruun Container test
        run: |
          docker run -d -p 3000:3000 --name test-container devops-nodejs-app:${{ github.sha }}
          sleep 3
